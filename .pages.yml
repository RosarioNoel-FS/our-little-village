# Pages CMS (pagescms.org) editor for ourlittlevillage.com. Saving commits here; .github/workflows/cms.yml rebuilds the pages.
media:
  input: assets/work
  output: /assets/work
  extensions: [jpg, jpeg, png, webp]
  rename: safe

settings:
  content:
    merge: true

content:
  - name: home
    label: "Homepage: What we do"
    type: file
    path: content/home.json
    format: json
    fields:
      - { name: heading, label: Section heading, type: string, required: true, description: "Put *stars* around words to show them in the fancy accent style, like: Birthday *Parties*" }
      - { name: intro, label: Line under the heading, type: text, required: true }
      - name: panels
        label: Panels
        type: object
        fields:
          - name: parties
