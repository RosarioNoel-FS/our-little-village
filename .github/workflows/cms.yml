# When the client saves in Pages CMS (or anyone pushes content/photos), shrink new photos, rebuild the pages, publish.
name: Rebuild pages from CMS edits
on:
  push:
    branches: [main]
    paths: ["content/**", "assets/work/**", "cms/**", ".pages.yml"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: cms-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - run: python3 cms/optimize.py assets/work
      - run: python3 cms/build.py
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Pages already up to date"; exit 0; fi
          git commit -m "Rebuild pages from CMS edit"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Could not request a Pages build; it should still run from the push."
